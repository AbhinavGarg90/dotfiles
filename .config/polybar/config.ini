[colors]
bg = #cc1e1e2e
bg-alt = #313244
fg = #cdd6f4
fg-alt = #1e1e2e
muted = #6c7086
accent = #89b4fa
warning = #f38ba8


[bar/main]
monitor = ${env:MONITOR:}
width = 100%
offset-x = 2%
height = 34
radius = 12
pseudo-transparency = false

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 0
border-size = 10

padding-left = 2
padding-right = 2
module-margin = 3

font-0 = "Caskaydia Cove Nerd Font:size=11;3"
font-1 = "Caskaydia Cove Nerd Font:size=13;3"

modules-left = workspaces
modules-center = date
modules-right = asus-profile cpu memory pulseaudio wlan battery tray power

cursor-click = pointer
enable-ipc = true
wm-restack = i3

[module/systray]
type = internal/tray

tray-spacing = 8
format-margin = 6

[module/workspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.accent}
label-active-foreground = ${colors.fg-alt}
label-active-padding = 3

label-occupied = %name%
label-occupied-background = ${colors.bg-alt}
label-occupied-foreground = ${colors.fg}
label-occupied-padding = 3

label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 3

enable-click = true
enable-scroll = true
sort-by-number = true

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.muted}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix-foreground = ${colors.accent}
format-volume =   <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.muted}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = 
label-layout-foreground = ${colors.accent}

label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.accent}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix-foreground = ${colors.accent}
label =  %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected =    %essid%
label-disconnected =   offline
label-disconnected-foreground = ${colors.muted}

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-}%local_ip%

[module/date]
type = internal/date
interval = 1
date = %a %b %d  %I:%M %p
label =  %date%
label-foreground = ${colors.accent}

[settings]
screenchange-reload = true
pseudo-transparency = false

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
low-at = 20

label-charging =  󰢜 %percentage%%
label-discharging =   %percentage%%
label-full =    100%

label-low =  %percentage%%
label-low-foreground = #ff5555

[module/power]
type = custom/menu

label-open = ⏻
label-close = 

menu-0-0 =  "   Lock"
menu-0-0-exec = i3lock

menu-0-1 = "   Suspend"
menu-0-1-exec = systemctl suspend

menu-0-2 = "   Reboot"
menu-0-2-exec = systemctl reboot

menu-0-3 = "   Shutdown"
menu-0-3-exec = systemctl poweroff

[module/asus-profile]
type = custom/script
exec = ~/.config/i3/bin/asus-profile-polybar
interval = 2
click-left = ~/.config/i3/bin/asus-profile-polybar


; vim:ft=dosini
